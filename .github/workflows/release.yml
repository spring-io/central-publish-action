name: Release
permissions:
  contents: read
on:
  push:
    tags:
      - v0.[0-9]+.[0-9]+
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  build:
    name: 'Build'
    runs-on: 'ubuntu-latest'
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Build
        id: build
        uses: ./.github/actions/build
    outputs:
      version: ${{ steps.build.outputs.version }}
  publish-image:
    name: 'Publish Docker image'
    needs:
      - build
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ format('ghcr.io/{0}:{1}', github.repository, github.ref_name) }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Check action.yaml references image
        run: |
          if ! grep -qF "image: 'docker://${IMAGE}'" action.yaml; then
            echo "action.yaml must reference docker://${IMAGE}"
            exit 1
          fi
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      # Released tags are referenced by consumers, never overwrite them
      - name: Check image doesn't exist
        run: |
          if docker buildx imagetools inspect "${IMAGE}" > /dev/null 2>&1; then
            echo "${IMAGE} already exists"
            exit 1
          fi
      - name: Build and push image
        run: |
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --tag "${IMAGE}" --push .
  deploy:
    name: 'Deploy to repo.spring.io'
    needs:
      - build
    uses: ./.github/workflows/deploy.yml
    with:
      repository: 'libs-release-local'
    secrets: inherit
  create-github-release:
    name: Create GitHub Release
    permissions:
      contents: write
    needs:
      - build
      - publish-image
      - deploy
    runs-on: 'ubuntu-latest'
    steps:
      - name: Check Out Code
        uses: actions/checkout@v7
      - name: Create GitHub Release
        uses: ./.github/actions/create-github-release
        with:
          milestone: ${{ needs.build.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
